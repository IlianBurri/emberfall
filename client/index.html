<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERFALL</title>
<meta name="description" content="EMBERFALL – Ego-Shooter im Browser: Story-Kampagne, Koop, LAN-PvP, Battle Royale und Battle Pass. Kostenlos, ohne Installation.">
<meta property="og:title" content="EMBERFALL">
<meta property="og:description" content="Ego-Shooter im Browser: Story, Koop, PvP, Battle Royale und Battle Pass.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><polygon points='8,1 15,8 8,15 1,8' fill='%23ff7a1a'/></svg>">
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }</script>
<style>
  :root { --acc: #ff7a1a; --acc2: #ffd23a; --bg: rgba(14, 18, 28, 0.86); --line: rgba(255,255,255,0.12); --txt: #eef2f7; --dim: #9aa6b6; --ok: #5dff8a; }
  * { box-sizing: border-box; }
  /* Eigene Scrollleisten im Emberfall-Stil (Chrome/Edge/Safari + Firefox) */
  * { scrollbar-width: thin; scrollbar-color: #ff7a1a rgba(255,255,255,.04); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,.035); border-radius: 10px; margin: 6px; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #ff9a3a, #c85400); border-radius: 10px; border: 2px solid rgba(11,14,22,.9); }
  ::-webkit-scrollbar-thumb:horizontal { background: linear-gradient(90deg, #ff9a3a, #c85400); }
  ::-webkit-scrollbar-thumb:hover { background: #ffb060; }
  ::-webkit-scrollbar-corner { background: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1220; color: var(--txt); font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 10px 16px; background: #2a3346; color: var(--txt); font-weight: 700; transition: transform .08s, background .15s; }
  button:hover:not(:disabled) { background: #36415a; transform: translateY(-1px); }
  button.primary { background: linear-gradient(180deg, #ff9a3a, #ff6a00); color: #1a0d00; box-shadow: 0 4px 0 #a84400; }
  button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ffb060, #ff7a1a); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  input, select { font: inherit; background: #1b2232; color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  input[type=range] { padding: 0; accent-color: var(--acc); }
  input[type=color] { padding: 0; width: 48px; height: 34px; }
  h1, h2, h3 { margin: 0 0 10px; }
  /* ---------- Lobby: Topbar, linke Navigation, Inhaltsbereich ---------- */
  :root { --navw: 270px; --toph: 64px; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: var(--toph); display: flex; align-items: center; gap: 12px; padding: 0 24px; background: linear-gradient(180deg, rgba(6,8,13,.95), rgba(6,8,13,.55) 70%, rgba(6,8,13,0)); z-index: 6; }
  #topbar .logo { font-weight: 900; font-size: 24px; letter-spacing: 3px; margin-right: 6px; }
  #topbar .logo span { color: var(--acc); }
  #topbar .spacer { flex: 1; }
  #topbar .chip { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #topbar .chip small { color: var(--dim); font-weight: 600; font-size: 11.5px; }
  #topbar .chip.btn { cursor: pointer; transition: background .15s, border-color .15s; }
  #topbar .chip.btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,122,26,.5); }
  #topbar .credits { color: var(--acc2); }
  .ic { width: 1.1em; height: 1.1em; vertical-align: -0.18em; display: inline-block; flex: none; }
  #topbar .emb .ic { width: 16px; height: 16px; vertical-align: 0; }
  #nav .item i .ic { width: 18px; height: 18px; vertical-align: -3px; }
  #nav .pcard .e .ic { width: 26px; height: 26px; vertical-align: 0; }
  #topbar .emb { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-size: 15px; }
  #topbar .lv { display: grid; place-items: center; min-width: 30px; height: 26px; border-radius: 6px; background: var(--acc); color: #1a0d00; font-weight: 900; }
  .xpbar { width: 110px; height: 5px; background: rgba(255,255,255,.14); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .xpbar i { display: block; height: 100%; background: var(--acc2); transition: width .6s ease; }
  #nav { position: fixed; top: var(--toph); left: 0; bottom: 0; width: var(--navw); z-index: 5; display: flex; flex-direction: column; padding: 18px 0 18px; background: linear-gradient(90deg, rgba(6,8,13,.94), rgba(6,8,13,.78) 75%, rgba(6,8,13,0)); }
  #nav .item { all: unset; box-sizing: border-box; position: relative; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 13px 26px; font-size: 17px; font-weight: 800; letter-spacing: 2.2px; color: #c9d1dc; white-space: nowrap; transition: color .15s, background .15s, padding-left .15s; }
  #nav .item i { font-style: normal; width: 22px; text-align: center; opacity: .8; font-size: 16px; }
  #nav .item:hover { color: #fff; background: linear-gradient(90deg, rgba(255,255,255,.07), transparent); padding-left: 30px; }
  #nav .item:active { background: linear-gradient(90deg, rgba(255,122,26,.18), transparent); }
  #nav .item.on { color: #fff; background: linear-gradient(90deg, rgba(255,122,26,.22), transparent); }
  #nav .item.on::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; background: var(--acc); border-radius: 0 3px 3px 0; box-shadow: 0 0 12px var(--acc); }
  #nav .item.play { margin: 0 18px 12px; padding: 16px 20px; border-radius: 10px; background: linear-gradient(180deg, #ff9a3a, #ff6a00); color: #1a0d00; font-size: 21px; letter-spacing: 3px; box-shadow: 0 6px 18px rgba(255,106,0,.25); }
  #nav .item.play:hover { padding-left: 24px; filter: brightness(1.08); }
  #nav .item.play.on::before { display: none; }
  #nav .item.play i { opacity: 1; }
  #nav .badge { margin-left: auto; }
  #nav .grow { flex: 1; }
  #nav .pcard { margin: 0 18px; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; border: 1px solid rgba(255,255,255,.1); cursor: pointer; }
  #nav .pcard .e { width: 44px; height: 44px; border-radius: 10px; background: rgba(0,0,0,.35); display: grid; place-items: center; font-size: 24px; }
  #nav .pcard b { display: block; font-size: 15px; }
  #nav .pcard small { color: rgba(255,255,255,.75); font-size: 12px; }
  #menu { position: fixed; top: calc(var(--toph) + 10px); left: calc(var(--navw) + 6px); bottom: 22px; width: min(600px, calc(100vw - var(--navw) - 40px)); background: rgba(11,14,22,.9); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px; overflow: auto; z-index: 4; backdrop-filter: blur(8px); display: none; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  #menu.wide { width: min(1040px, calc(100vw - var(--navw) - 40px)); }
  #menu.open { animation: pin .18s ease-out; }
  @keyframes pin { from { opacity: 0; transform: translateX(-12px); } }
  #menu .subtabs { display: flex; gap: 4px; align-items: center; margin: -4px 0 14px; border-bottom: 1px solid var(--line); }
  #menu .subtabs button { background: none; border-radius: 0; padding: 10px 14px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; font-size: 13.5px; border-bottom: 2px solid transparent; transform: none; }
  #menu .subtabs button:hover { color: #fff; background: rgba(255,255,255,.04); }
  #menu .subtabs button.on { color: #fff; border-bottom-color: var(--acc); }
  #menu .subtabs .x { margin-left: auto; font-size: 18px; padding: 6px 10px; }
  #menu .back[data-go="home"], #menu #lback { display: none; }
  #homeinfo { position: fixed; right: 26px; bottom: 26px; width: 320px; z-index: 4; display: flex; flex-direction: column; gap: 10px; }
  #homeinfo .hc { background: rgba(11,14,22,.82); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; backdrop-filter: blur(6px); transition: border-color .15s, transform .15s; }
  #homeinfo .hc:hover { border-color: rgba(255,122,26,.6); transform: translateY(-2px); }
  #homeinfo .hc small { color: var(--dim); font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; }
  #homeinfo .hc b { display: block; font-size: 16px; margin: 2px 0 6px; }
  #fade { position: fixed; inset: 0; background: #05070c; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .45s ease; }
  /* ---------- Battle Pass ---------- */
  .bp-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .bp-badge { width: 92px; height: 92px; border-radius: 14px; background: linear-gradient(160deg, #ff9a3a, #b84400); color: #1a0d00; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(255,106,0,.25); }
  .bp-badge b { font-size: 38px; line-height: 1; }
  .bp-badge small { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; }
  .bp-title { font-size: 22px; font-weight: 900; letter-spacing: 2px; }
  .bp-title span { font-size: 14px; color: var(--dim); letter-spacing: 0; font-weight: 600; margin-left: 8px; }
  .bp-bar { height: 10px; background: rgba(255,255,255,.1); border-radius: 5px; overflow: hidden; margin: 8px 0 6px; }
  .bp-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb060, var(--acc)); border-radius: 5px; transition: width .8s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 10px rgba(255,122,26,.6); }
  .bp-trackwrap { display: flex; gap: 8px; background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .bp-rowlabels { display: grid; grid-template-rows: 30px 150px 150px; gap: 8px; flex: none; width: 26px; }
  .bp-rowlabels span { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 12px; font-weight: 900; letter-spacing: 3px; color: var(--dim); }
  .bp-rowlabels .premium { color: #ffcc55; }
  .bp-track { display: flex; gap: 8px; overflow-x: auto; scroll-behavior: smooth; padding-bottom: 6px; }
  .bp-col { flex: none; width: 128px; display: grid; grid-template-rows: 30px 150px 150px; gap: 8px; }
  .bp-lvl { display: grid; place-items: center; font-weight: 900; border-radius: 6px; background: rgba(255,255,255,.06); color: var(--dim); }
  .bp-col.reached .bp-lvl { background: rgba(255,122,26,.25); color: #fff; }
  .bp-col.cur .bp-lvl { background: var(--acc); color: #1a0d00; box-shadow: 0 0 12px rgba(255,122,26,.7); }
  .bp-card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 4px; padding: 10px 6px 8px; border-radius: 10px; background: linear-gradient(180deg, #1c2333, #141a26); border: 1px solid rgba(255,255,255,.08); border-bottom: 3px solid var(--rc); font-weight: 700; text-align: center; transition: transform .15s, box-shadow .15s, border-color .15s; overflow: hidden; }
  .bp-card:hover:not(:disabled) { transform: translateY(-3px); background: linear-gradient(180deg, #232c40, #182030); box-shadow: 0 8px 20px rgba(0,0,0,.4); }
  .bp-card.premium { background: linear-gradient(180deg, #2a2418, #18140c); }
  .bp-card .bp-ico canvas, .bp-detail canvas { position: static; display: block; }
  .bp-card .bp-ico canvas { width: 64px; height: 64px; border-radius: 10px; }
  .bp-detail canvas { width: 72px; height: 72px; border-radius: 10px; }
  .bp-card .bp-name { font-size: 12.5px; line-height: 1.2; max-height: 2.4em; overflow: hidden; }
  .bp-card .bp-state { font-size: 11px; color: var(--dim); font-weight: 700; }
  .bp-card.st-locked, .bp-card.st-premium { filter: saturate(.35) brightness(.75); }
  .bp-card.st-locked .bp-ico, .bp-card.st-premium .bp-ico { opacity: .7; }
  .bp-card.st-ready { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc), 0 0 18px rgba(255,122,26,.35); }
  .bp-card.st-ready .bp-state { color: #1a0d00; background: var(--acc); border-radius: 5px; padding: 2px 10px; }
  .bp-card.st-claimed .bp-state { color: var(--ok); }
  .bp-card.st-claimed::after { content: ''; position: absolute; inset: 0; background: rgba(5,8,14,.35); pointer-events: none; }
  .bp-card.pop { animation: pop .7s ease-out; }
  @keyframes pop { 0% { transform: scale(.85); box-shadow: 0 0 0 0 rgba(93,255,138,.8); } 50% { transform: scale(1.08); box-shadow: 0 0 30px 6px rgba(93,255,138,.5); } 100% { transform: scale(1); } }
  .bp-detail { display: flex; gap: 14px; align-items: center; margin: 12px 0; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); min-height: 98px; }
  .bp-note { margin-top: 10px; }
  .bp-prem { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 14px; border-radius: 10px; background: linear-gradient(90deg, rgba(255,204,85,.12), rgba(255,204,85,.02)); border: 1px solid rgba(255,204,85,.3); }
  .bp-prem.ready { border-color: #ffcc55; box-shadow: 0 0 18px rgba(255,204,85,.25); }
  .bp-prem.ready button { margin-left: auto; background: linear-gradient(180deg, #ffe08a, #e8a820); box-shadow: 0 4px 0 #8a6010; }
  .bp-prem.owned { border-color: var(--ok); background: linear-gradient(90deg, rgba(93,255,138,.12), transparent); }
  button.cos.on { outline: 2px solid var(--acc); }
  /* ---------- Kleine Fenster ---------- */
  @media (max-width: 1100px) { :root { --navw: 220px; } #nav .item { font-size: 15px; padding: 11px 20px; letter-spacing: 1.6px; } #nav .item.play { font-size: 18px; } #homeinfo { width: 270px; } .xpbar { width: 70px; } }
  @media (max-width: 860px) {
    :root { --navw: 0px; --toph: 54px; }
    #topbar { padding: 0 12px; gap: 8px; } #topbar .logo { font-size: 18px; letter-spacing: 2px; } #topbar .hide-s { display: none; }
    #nav { top: auto; height: auto; width: 100%; flex-direction: row; padding: 6px; overflow-x: auto; background: rgba(6,8,13,.95); border-top: 1px solid var(--line); }
    #nav .item { flex-direction: column; gap: 2px; padding: 6px 10px; font-size: 11px; letter-spacing: 1px; flex: none; }
    #nav .item.play { margin: 0 6px 0 0; padding: 8px 14px; font-size: 14px; }
    #nav .item.on::before { left: 8px; right: 8px; top: auto; bottom: 0; width: auto; height: 3px; }
    #nav .grow, #nav .pcard { display: none; }
    #menu, #menu.wide { left: 8px; right: 8px; width: auto; bottom: 74px; top: calc(var(--toph) + 6px); }
    #homeinfo { left: 12px; right: 12px; width: auto; bottom: 80px; flex-direction: row; overflow-x: auto; }
    #homeinfo .hc { min-width: 170px; padding: 8px 10px; flex: 1; }
    #homeinfo .hc .dim, #homeinfo .hc:nth-child(3) { display: none; }
    #homeinfo .hc b { font-size: 14px; margin: 0 0 4px; }
  }
  @media (max-width: 480px) { #topbar .nm { display: none; } #topbar .chip { padding: 5px 8px; } #homeinfo .hc:nth-child(2) { display: none; } }
  .navgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .navgrid button { text-align: left; padding: 16px; font-size: 17px; }
  .navgrid button small { display: block; font-weight: 400; color: var(--dim); font-size: 12.5px; margin-top: 3px; }
  .navgrid .big { grid-column: span 2; font-size: 21px; }
  .badge { background: #ff3a3a; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 12px; margin-left: 6px; }
  .back { margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .card { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .card.sel { border-color: var(--acc); background: rgba(255,122,26,.1); }
  .card.locked { opacity: .5; }
  .dim { color: var(--dim); font-size: 13.5px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { display: grid; grid-template-columns: 110px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; margin: 3px 0; }
  .stat .b { height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; }
  .stat .b i { display: block; height: 100%; background: var(--acc); }
  .skinbox { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; width: 84px; font-size: 11.5px; text-align: center; }
  .skinbox canvas { position: static; width: 56px; height: 56px; border-radius: 8px; }
  .skinbox.sel { border-color: var(--acc); }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button.on { background: var(--acc); color: #1a0d00; }
  .prog { height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .prog i { display: block; height: 100%; background: var(--ok); }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  /* Kisten */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 20; }
  #modal .box { background: #131a2a; border: 1px solid var(--line); border-radius: 18px; padding: 24px; width: min(900px, 94vw); text-align: center; }
  .strip-wrap { position: relative; overflow: hidden; height: 130px; border-radius: 12px; background: #0b0f1a; margin: 16px 0; }
  .strip-wrap::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: var(--acc2); transform: translateX(-50%); box-shadow: 0 0 12px var(--acc2); }
  .strip { position: absolute; left: 0; top: 10px; display: flex; gap: 8px; will-change: transform; }
  .strip .it { width: 110px; height: 110px; border-radius: 10px; background: #1b2232; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; border-bottom: 5px solid; flex: none; }
  .strip .it canvas { position: static; width: 64px; height: 64px; border-radius: 8px; margin-bottom: 4px; }
  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 3; font-weight: 700; text-shadow: 0 2px 3px rgba(0,0,0,.6); }
  #crosshair { position: absolute; left: 50%; top: 50%; }
  #crosshair i { position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #crosshair i:nth-child(1), #crosshair i:nth-child(2) { width: 2px; height: 10px; }
  #crosshair i:nth-child(3), #crosshair i:nth-child(4) { width: 10px; height: 2px; }
  #crosshair b { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 2px; transform: translate(-50%,-50%); }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%,-50%) rotate(45deg); opacity: 0; }
  #hitmarker::before, #hitmarker::after { content: ''; position: absolute; background: #fff; }
  #hitmarker::before { left: 12px; top: 0; width: 2px; height: 26px; }
  #hitmarker::after { top: 12px; left: 0; height: 2px; width: 26px; }
  #hitmarker.show { opacity: 1; }
  #hitmarker.head::before, #hitmarker.head::after { background: var(--acc2); }
  #hitmarker.kill::before, #hitmarker.kill::after { background: #ff3a3a; }
  #hitmarker.kill { width: 36px; height: 36px; }
  #scope { position: absolute; inset: 0; display: none; background: radial-gradient(circle at center, transparent 0, transparent 37vh, #000 37.3vh); }
  #scope div { position: absolute; left: 50%; top: 50%; width: 74vh; height: 74vh; transform: translate(-50%,-50%);
    background: linear-gradient(#000,#000) center/1.5px 100% no-repeat, linear-gradient(#000,#000) center/100% 1.5px no-repeat; }
  #vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at center, transparent 45%, rgba(220,20,20,.65) 100%); }
  #objective { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.45); padding: 8px 18px; border-radius: 10px; font-size: 17px; white-space: nowrap; }
  #timer { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); font-size: 18px; }
  #radio { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); background: rgba(10,40,30,.6); border-left: 4px solid var(--ok); padding: 8px 16px; border-radius: 6px; opacity: 0; transition: opacity .4s; max-width: 70vw; }
  #center-msg { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 900; opacity: 0; transition: opacity .5s; text-align: center; }
  #killfeed { position: absolute; top: 16px; right: 18px; text-align: right; font-size: 14px; }
  #killfeed div { background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 6px; margin-bottom: 4px; }
  #killfeed span { color: var(--acc2); }
  #feed { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); text-align: center; color: var(--acc2); font-size: 16px; }
  #hpbox { position: absolute; left: 22px; bottom: 22px; width: 240px; }
  #hpbox .bar { height: 14px; background: rgba(0,0,0,.5); border-radius: 7px; overflow: hidden; border: 2px solid rgba(255,255,255,.3); }
  #hpbox .bar i { display: block; height: 100%; width: 100%; transition: width .15s; }
  #hpbox span { font-size: 26px; }
  #hpbox .bar.armor { height: 9px; margin-bottom: 4px; display: none; border-width: 1px; }
  #hpbox .bar.armor i { background: #4aa3ff; width: 0; }
